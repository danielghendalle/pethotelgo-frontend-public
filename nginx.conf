server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are content-addressed — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker, manifest and entry HTML must always revalidate so a
    # new deploy is picked up immediately.
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /registerSW.js    { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html       { add_header Cache-Control "no-cache"; }

    # Support React Router (SPA) — return index.html for all unknown routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
